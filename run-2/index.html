<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Signal Desk — Applications</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div><span class="mark">SD</span><p class="label">Personal search operations</p></div><blockquote>Momentum comes from the next honest action.</blockquote></aside>
<main><header><div><p class="label">Application command desk</p><h1>Signal Desk</h1></div><button id="new" class="accent">Add opportunity</button></header>
<section id="metrics" class="metrics"></section><section id="next" class="next"></section>
<section><div class="section-title"><h2>Pipeline</h2><button id="export" class="text-button">Export data ↗</button></div><div id="pipeline"></div><p id="empty" hidden>No opportunities recorded yet.</p></section></main>
<dialog id="editor"><form id="form"><div class="section-title"><h2>New opportunity</h2><button type="button" id="close" class="text-button">Close</button></div><label>Company<input name="company" required></label><label>Role<input name="role" required></label><div class="split"><label>Stage<select name="status"><option>Wishlist</option><option selected>Applied</option><option>Screen</option><option>Interview</option><option>Offer</option></select></label><label>Deadline<input type="date" name="deadline"></label></div><label>Next action<input name="nextAction"></label><label>Private notes<textarea name="notes" rows="3"></textarea></label><button class="accent full">Save opportunity</button></form></dialog><script type="module" src="app.js"></script></body></html>
