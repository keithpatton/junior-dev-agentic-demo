<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Move — Job search field notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div><span class="eyebrow">Job search field notes</span><h1>Next Move</h1></div>
    <p class="date-line" id="today"></p>
  </header>

  <main>
    <section class="intro">
      <p class="kicker">A calm record of every conversation, deadline, and promise.</p>
      <button id="open-form" class="primary">＋ Add application</button>
    </section>

    <section id="stats" class="stats" aria-label="Application summary"></section>

    <section class="ledger-section">
      <div class="section-heading">
        <div><span class="eyebrow">The ledger</span><h2>Active applications</h2></div>
        <button id="export" class="quiet">Export JSON</button>
      </div>
      <div id="empty" class="empty" hidden>No applications yet. Add the first promising role.</div>
      <div id="ledger" class="ledger"></div>
    </section>
  </main>

  <dialog id="application-dialog">
    <form id="application-form" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">New lead</span><h2>Record an application</h2></div><button value="cancel" class="icon" aria-label="Close">×</button></div>
      <label>Company<input name="company" required autocomplete="organization"></label>
      <label>Role<input name="role" required></label>
      <div class="form-row">
        <label>Status<select name="status"><option>Wishlist</option><option selected>Applied</option><option>Screen</option><option>Interview</option><option>Offer</option></select></label>
        <label>Due date<input name="deadline" type="date"></label>
      </div>
      <label>Next action<input name="nextAction" placeholder="e.g. Prepare three questions"></label>
      <label>Notes<textarea name="notes" rows="3" placeholder="People, context, useful details"></textarea></label>
      <button class="primary wide" value="default">Save application</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
